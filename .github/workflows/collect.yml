name: Collect availability
on:
  schedule:
    - cron: "17 */3 * * *" # backup only: each run re-starts itself when it ends
  workflow_dispatch: {}
permissions:
  contents: write # push the data branch
  actions: write  # re-dispatch this workflow
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Collect for 5.5 hours (about 6 Jane calls a minute), publish to the data branch every 2 minutes
        id: collect
        timeout-minutes: 340
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          node collect.js --minutes 330
      - name: Start the next run (skipped if cancelled by hand, or if the collector stopped within 20 minutes)
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ steps.collect.outputs.start }}
        run: |
          ran=$(( ($(date +%s) - ${START:-$(date +%s)}) / 60 ))
          if [ "$ran" -lt 20 ]; then
            echo "Collector ran only $ran min. Not restarting, so a startup crash cannot loop. The backup schedule retries within 3 hours."
            exit 0
          fi
          gh workflow run collect.yml --ref main --repo "$GITHUB_REPOSITORY"
