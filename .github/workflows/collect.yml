name: Collect availability
on:
  schedule:
    - cron: "5 * * * *" # backup trigger; a running job keeps going for ~6 hours
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Collect locations in 6 rotating groups, one group every 10 minutes, for ~5.5 hours
        run: |
          git config user.name "availability-bot"
          git config user.email "availability-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 330*60 ))
          n=0
          while [ $(date +%s) -lt $end ]; do
            start=$(date +%s)
            b=$(( n % 6 ))
            node collect.js --batch $b --merge data/availability.json || echo "group $b had a problem"
            if [ -f data/availability.json ]; then
              git add data/availability.json
              git commit -q -m "availability group $b" && (git pull -q --rebase && git push -q) || echo "nothing to save"
            fi
            n=$(( n + 1 ))
            wait=$(( 600 - ($(date +%s) - start) ))
            if [ $wait -gt 0 ]; then sleep $wait; fi
          done
